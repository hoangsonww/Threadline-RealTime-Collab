version: 2

updates:
  # ── npm ─────────────────────────────────────────────────────────────────────
  # This is an npm-workspaces monorepo: the root manifest and every
  # `apps/*/package.json` resolve against a single lockfile, so they are
  # declared together and updated in one pass rather than three racing PRs.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/api"
      - "/apps/realtime"
      - "/apps/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 8
    versioning-strategy: increase
    labels:
      - "type: dependencies"
      - "area: build"
    commit-message:
      # Matches this repository's conventional-commit convention.
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      # One PR per coherent surface. Ungrouped dependency bumps generate more
      # review load than they remove.
      types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      linting-and-formatting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "prettier-*"
          - "globals"
          - "husky"
          - "lint-staged"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@cloudflare/vitest-pool-workers"
          - "@playwright/test"
          - "playwright"
          - "supertest"
          - "@types/supertest"
      documentation:
        patterns:
          - "typedoc"
          - "typedoc-*"
      next-and-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      sentry:
        patterns:
          - "@sentry/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Node's own major line is pinned by `engines` and the Dockerfiles;
      # bumping it is a deliberate infrastructure decision, not a dependency
      # update, and it needs the container and Kubernetes jobs re-validated.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - "type: dependencies"
      - "area: ci"
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # ── Container base images ───────────────────────────────────────────────────
  - package-ecosystem: docker
    directories:
      - "/apps/api"
      - "/apps/realtime"
      - "/apps/web"
      - "/.devcontainer"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - "type: dependencies"
      - "area: infra"
    commit-message:
      prefix: "build"
      include: scope
    groups:
      base-images:
        patterns:
          - "*"

  # ── Dev container features ──────────────────────────────────────────────────
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - "type: dependencies"
      - "area: dx"
    commit-message:
      prefix: "chore"
      include: scope
