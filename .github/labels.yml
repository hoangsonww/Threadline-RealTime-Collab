# Canonical label set for this repository.
#
# Synced to GitHub by .github/workflows/labeler.yml on pushes to main that touch
# this file. Labels not listed here are left alone rather than deleted — this is
# an additive source of truth, not a destructive one.

# ── Area: which part of the system a change touches ───────────────────────────
- name: "area: api"
  color: "0E8A16"
  description: "apps/api — Express identity and persistence tier"
- name: "area: realtime"
  color: "F38020"
  description: "apps/realtime — Cloudflare Worker and Durable Object"
- name: "area: web"
  color: "1D76DB"
  description: "apps/web — Next.js frontend"
- name: "area: infra"
  color: "326CE5"
  description: "Docker, Kubernetes, and deployment manifests"
- name: "area: ci"
  color: "2088FF"
  description: "GitHub Actions workflows and automation"
- name: "area: build"
  color: "5319E7"
  description: "Toolchain, configs, dependencies, and scripts"
- name: "area: dx"
  color: "BFD4F2"
  description: "Developer experience — dev containers, hooks, agent harness"
- name: "area: security"
  color: "B60205"
  description: "Touches a trust boundary or an authorization check"
- name: "area: seo"
  color: "C2E0C6"
  description: "Metadata, structured data, robots, sitemap, llms.txt"
- name: "area: openapi"
  color: "85EA2D"
  description: "OpenAPI specification and the rendered API reference"

# ── Type: what kind of change it is ───────────────────────────────────────────
- name: "type: bug"
  color: "D73A4A"
  description: "Behaves differently from how it is documented or intended"
- name: "type: feature"
  color: "0075CA"
  description: "A capability Threadline does not have yet"
- name: "type: docs"
  color: "0052CC"
  description: "Documentation only"
- name: "type: adr"
  color: "5319E7"
  description: "Records an architectural decision"
- name: "type: tests"
  color: "6E9F18"
  description: "Test coverage and test infrastructure"
- name: "type: refactor"
  color: "FBCA04"
  description: "Behavior-preserving restructuring"
- name: "type: performance"
  color: "FEF2C0"
  description: "Measured latency, throughput, or resource improvement"
- name: "type: dependencies"
  color: "0366D6"
  description: "Dependency updates"

# ── Status: where it is in the pipeline ───────────────────────────────────────
- name: "status: needs triage"
  color: "E4E669"
  description: "Not yet assessed"
- name: "status: blocked"
  color: "D93F0B"
  description: "Waiting on something outside this change"
- name: "status: needs discussion"
  color: "D4C5F9"
  description: "Design is not settled; needs an ADR or a decision"
- name: "status: wontfix"
  color: "FFFFFF"
  description: "Intentional behavior, or out of scope"
- name: "status: duplicate"
  color: "CFD3D7"
  description: "Already tracked elsewhere"

# ── Size: rough review cost, applied automatically from the diff ──────────────
- name: "size: XS"
  color: "3CBF00"
  description: "Under 20 changed lines"
- name: "size: S"
  color: "5D9801"
  description: "20–99 changed lines"
- name: "size: M"
  color: "7F7203"
  description: "100–499 changed lines"
- name: "size: L"
  color: "A14C05"
  description: "500–999 changed lines"
- name: "size: XL"
  color: "C32607"
  description: "1000+ changed lines — consider splitting"

# ── Miscellaneous ─────────────────────────────────────────────────────────────
- name: "good first issue"
  color: "7057FF"
  description: "Self-contained, with a clear definition of done"
- name: "help wanted"
  color: "008672"
  description: "Maintainer would welcome a contributor picking this up"
- name: "breaking change"
  color: "B60205"
  description: "Requires operator action to deploy"
