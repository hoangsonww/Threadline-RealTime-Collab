name: CI / CD Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  #  Stage 1 — Setup
  # ──────────────────────────────────────────────────────────────
  preflight:
    name: "🧭 Preflight"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: |
          echo "Node.js version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "Workspaces:"
          ls apps

  # ──────────────────────────────────────────────────────────────
  #  Stage 2 — Static checks (parallel)
  # ──────────────────────────────────────────────────────────────
  lint-format:
    name: "🧹 Lint & Format"
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  typecheck:
    name: "🔎 Typecheck"
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  security-audit:
    name: "🔒 Security Audit"
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high || true

  # ──────────────────────────────────────────────────────────────
  #  Stage 3 — Test
  # ──────────────────────────────────────────────────────────────
  test:
    name: "🧪 Test Suites"
    needs: [lint-format, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # ──────────────────────────────────────────────────────────────
  #  Stage 4 — Build
  # ──────────────────────────────────────────────────────────────
  build:
    name: "🏗️ Build"
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  # ──────────────────────────────────────────────────────────────
  #  Stage 5 — Deployment target validation (parallel)
  # ──────────────────────────────────────────────────────────────
  containers:
    name: "🐳 Validate Container Images"
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

      # A build that succeeds proves almost nothing about these images. The
      # realtime image spawns workerd, a native binary, and an image can build
      # perfectly while that binary is unable to execute — which is exactly what
      # happened on an Alpine base, where workerd's glibc interpreter is absent
      # and `execve` fails with a misleading ENOENT. Starting the stack and
      # waiting for every healthcheck is the cheapest check that would have
      # caught it.
      - name: Start the stack and wait for every service to report healthy
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 180
          docker compose ps

      - name: Smoke-test each service over HTTP
        run: |
          set -euo pipefail
          check() {
            printf '  %-34s' "$1"
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 "$1")
            echo "$code"
          }
          check http://localhost:4000/health
          check http://localhost:8787/health
          check http://localhost:3000/
          check http://localhost:3000/llms.txt
          check http://localhost:3000/robots.txt
          check http://localhost:3000/sitemap.xml
          check http://localhost:4000/openapi.json
          check http://localhost:4000/.well-known/openid-configuration
          # Proves the web tier's same-origin proxy actually reaches the API
          # container, which no unit test covers.
          check http://localhost:3000/api/identity/health

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  kubernetes:
    name: "☸️ Validate Kubernetes Overlays"
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - run: npm run k8s:validate

  # ──────────────────────────────────────────────────────────────
  #  Stage 6 — Publish images to GHCR (main branch / manual only)
  # ──────────────────────────────────────────────────────────────
  docker-web:
    name: "🌐 Web → GHCR"
    needs: [containers]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/threadline-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/threadline-web:latest

  docker-api:
    name: "🚂 API → GHCR"
    needs: [containers]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/threadline-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/threadline-api:latest

  docker-realtime:
    name: "⚡ Realtime → GHCR"
    needs: [containers]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/realtime/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/threadline-realtime:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/threadline-realtime:latest

  # ──────────────────────────────────────────────────────────────
  #  Stage 7 — Image vulnerability scan (informational only)
  # ──────────────────────────────────────────────────────────────
  image-scan:
    name: "🔍 Image Vulnerability Scan"
    needs: [docker-web, docker-api, docker-realtime]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.3
          cache: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/threadline-web:latest
          format: sarif
          exit-code: 0
          skip-setup-trivy: true
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/threadline-api:latest
          format: sarif
          exit-code: 0
          skip-setup-trivy: true
      - name: Scan realtime image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/threadline-realtime:latest
          format: sarif
          exit-code: 0
          skip-setup-trivy: true

  # ──────────────────────────────────────────────────────────────
  #  Stage 8 — Pipeline summary
  # ──────────────────────────────────────────────────────────────
  done:
    name: "🎉 Pipeline Summary"
    if: always()
    needs:
      - preflight
      - lint-format
      - typecheck
      - security-audit
      - test
      - build
      - containers
      - kubernetes
      - docker-web
      - docker-api
      - docker-realtime
      - image-scan
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        run: |
          icon() {
            case "$1" in
              success)   echo "✅ success" ;;
              failure)   echo "❌ failure" ;;
              cancelled) echo "🚫 cancelled" ;;
              skipped)   echo "⏭️ skipped" ;;
              *)         echo "❔ $1" ;;
            esac
          }

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          echo "::group::🎉 Threadline CI / CD Pipeline summary"

          {
            echo "# 🎉 Threadline CI / CD Pipeline"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow run | [\`${{ github.workflow }}\` #${{ github.run_number }}]($RUN_URL) (attempt ${{ github.run_attempt }}) |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Branch / ref | \`${{ github.ref_name }}\` |"
            echo "| Commit | [\`${{ github.sha }}\`]($COMMIT_URL) |"
            echo "| Triggered by | @${{ github.actor }} |"
            echo ""
            echo "## Stage results"
            echo ""
            echo "<details open>"
            echo "<summary><strong>Setup &amp; static checks</strong></summary>"
            echo ""
            echo "| Job | Status |"
            echo "| --- | --- |"
            echo "| 🧭 Preflight | $(icon "${{ needs.preflight.result }}") |"
            echo "| 🧹 Lint & Format | $(icon "${{ needs.lint-format.result }}") |"
            echo "| 🔎 Typecheck | $(icon "${{ needs.typecheck.result }}") |"
            echo "| 🔒 Security Audit _(non-blocking)_ | $(icon "${{ needs.security-audit.result }}") |"
            echo ""
            echo "</details>"
            echo ""
            echo "<details open>"
            echo "<summary><strong>Test, build &amp; deployment-target validation</strong></summary>"
            echo ""
            echo "| Job | Status |"
            echo "| --- | --- |"
            echo "| 🧪 Test Suites | $(icon "${{ needs.test.result }}") |"
            echo "| 🏗️ Build | $(icon "${{ needs.build.result }}") |"
            echo "| 🐳 Validate Container Images | $(icon "${{ needs.containers.result }}") |"
            echo "| ☸️ Validate Kubernetes Overlays | $(icon "${{ needs.kubernetes.result }}") |"
            echo ""
            echo "</details>"
            echo ""
            echo "<details open>"
            echo "<summary><strong>GHCR publish &amp; image scan (main branch / manual only)</strong></summary>"
            echo ""
            echo "| Job | Status |"
            echo "| --- | --- |"
            echo "| 🌐 Web → GHCR | $(icon "${{ needs.docker-web.result }}") |"
            echo "| 🚂 API → GHCR | $(icon "${{ needs.docker-api.result }}") |"
            echo "| ⚡ Realtime → GHCR | $(icon "${{ needs.docker-realtime.result }}") |"
            echo "| 🔍 Image Vulnerability Scan _(non-blocking)_ | $(icon "${{ needs.image-scan.result }}") |"
            echo ""
            echo "</details>"
            echo ""
            echo "**Completed at** \`$(date -u +"%Y-%m-%dT%H:%M:%SZ")\` UTC"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "::endgroup::"

      - name: Report overall pipeline result
        run: |
          all_ok=true
          for r in ${{ needs.preflight.result }} ${{ needs.lint-format.result }} ${{ needs.typecheck.result }} ${{ needs.test.result }} ${{ needs.build.result }} ${{ needs.containers.result }} ${{ needs.kubernetes.result }}; do
            if [ "$r" != "success" ]; then
              all_ok=false
            fi
          done

          if [ "$all_ok" = false ]; then
            echo "::error title=Threadline CI / CD Pipeline::One or more required stages did not pass for ${{ github.sha }} — see the job summary above for details."
            exit 1
          fi

          echo "::notice title=Threadline CI / CD Pipeline::All required stages passed for ${{ github.sha }}."
