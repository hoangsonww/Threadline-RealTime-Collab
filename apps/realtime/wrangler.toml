name = "threadline-realtime"
main = "src/index.ts"
compatibility_date = "2026-07-31"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[vars]
PERSISTENCE_WEBHOOK = "https://threadline-api-liard.vercel.app/v1/internal/room-events"

[secrets]
required = ["ROOM_TICKET_SECRET", "PERSISTENCE_SECRET"]
