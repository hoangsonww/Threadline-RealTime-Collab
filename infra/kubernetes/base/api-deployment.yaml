apiVersion: apps/v1
kind: Deployment
metadata:
  name: threadline-api
  labels:
    app.kubernetes.io/name: threadline-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: threadline
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: threadline-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: threadline-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: threadline
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # A soft preference, not a hard requirement (ScheduleAnyway) — a
      # single-node cluster (e.g. the development overlay) still schedules
      # every replica fine, it just stops PodDisruptionBudget/HPA from being
      # undermined by every replica landing on the one node that goes down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: threadline-api
      containers:
        - name: api
          image: threadline-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: threadline-runtime
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: threadline-runtime
                  key: PORT
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: threadline-runtime
                  key: COOKIE_SECURE
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: threadline-runtime
                  key: WEB_ORIGIN
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: threadline-runtime
                  key: OIDC_ISSUER
            - name: AUTH_ACTION_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: threadline-runtime
                  key: AUTH_ACTION_ORIGIN
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: threadline-secrets
                  key: MONGODB_URI
            - name: ROOM_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: threadline-secrets
                  key: ROOM_TICKET_SECRET
            - name: INTERNAL_INGEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: threadline-secrets
                  key: INTERNAL_INGEST_SECRET
            - name: OIDC_PRIVATE_JWK
              valueFrom:
                secretKeyRef:
                  name: threadline-secrets
                  key: OIDC_PRIVATE_JWK
            - name: AUTH_DELIVERY_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: threadline-secrets
                  key: AUTH_DELIVERY_WEBHOOK
            - name: AUTH_DELIVERY_SECRET
              valueFrom:
                secretKeyRef:
                  name: threadline-secrets
                  key: AUTH_DELIVERY_SECRET
            # Optional — error/performance monitoring. Sentry.init() no-ops
            # without a DSN, so a Secret with no SENTRY_DSN key is fine; the
            # pod starts identically either way.
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: threadline-secrets
                  key: SENTRY_DSN
                  optional: true
            # Optional — ephemeral cache for rate-limit windows and session
            # bookkeeping. It carries a password, so it is a Secret rather than
            # a ConfigMap value. Absent (or unreachable), the API starts anyway
            # and those operations go to MongoDB, so this must stay `optional`
            # — see docs/decisions/0009-redis-for-ephemeral-counters.md.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: threadline-secrets
                  key: REDIS_URL
                  optional: true
            - name: REDIS_KEY_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: threadline-runtime
                  key: REDIS_KEY_PREFIX
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
