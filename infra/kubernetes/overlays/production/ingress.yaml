apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threadline
spec:
  tls:
    - hosts:
        - threadline.example.invalid
        - api.threadline.example.invalid
      secretName: threadline-tls
  rules:
    - host: threadline.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: threadline-web
                port:
                  name: http
    - host: api.threadline.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: threadline-api
                port:
                  name: http
