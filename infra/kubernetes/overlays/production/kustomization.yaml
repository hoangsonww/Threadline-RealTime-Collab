apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: threadline-production

resources:
  - ../../base
  - namespace.yaml

images:
  - name: threadline-api
    newName: ghcr.io/your-organization/threadline-api
    newTag: "1.0.0"
  - name: threadline-web
    newName: ghcr.io/your-organization/threadline-web
    newTag: "1.0.0"

patches:
  - path: runtime.yaml
  - path: ingress.yaml
